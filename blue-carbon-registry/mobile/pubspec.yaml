name: blue_carbon_registry
description: "SIH 25038 Blue Carbon Registry & MRV System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^12.1.3

  # Networking
  dio: ^5.4.0

  # Local Database
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.2
  path: ^1.8.3

  # Background Tasks
  workmanager: ^0.5.2

  # UI & Animations
  lottie: ^2.7.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0

  # Location & Maps
  geolocator: ^10.1.0
  permission_handler: ^11.2.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # Media & Files
  image_picker: ^1.0.7
  file_picker: ^6.1.1

  # Speech & Localization
  speech_to_text: ^6.6.0
  flutter_localizations:
    sdk: flutter
  intl: any

  # Connectivity
  connectivity_plus: ^5.0.2

  # Crypto & Blockchain
  web3dart: ^2.7.3

  # Utils
  uuid: ^4.3.3
  share_plus: ^7.2.2
  url_launcher: ^6.2.4

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  drift_dev: ^2.14.1
  build_runner: ^2.4.7

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/icons/
